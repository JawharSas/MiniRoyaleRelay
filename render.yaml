# Render blueprint for the Mini Royale relay (free plan, no credit card).
# Nothing here runs on a player's PC - only relay.py (with admin.html next to it) runs on Render.
services:
  - type: web
    name: mini-royale-relay
    runtime: python
    plan: free
    buildCommand: echo "no dependencies"
    startCommand: python relay.py
    healthCheckPath: /
    envVars:
      # Secrets are typed into the Render dashboard, never written in a file.
      - key: ADMIN_PASSWORD            # password of the private admin page at /admin (10+ characters)
        sync: false
      - key: REDIS_URL                 # Redis database that keeps the player accounts (redis://user:password@host:port)
        sync: false
      - key: UPSTASH_REDIS_REST_URL    # or instead of REDIS_URL: a free Upstash Redis database
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
